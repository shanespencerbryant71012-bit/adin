<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDEN — learns and self-edits</title>
<style>
:root{
  color-scheme: dark;
  font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #090b12;
  color: #edf3ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 20% 10%, rgba(111, 90, 255, 0.24), transparent 26%),
    radial-gradient(circle at 80% 0%, rgba(45, 198, 255, 0.20), transparent 22%),
    #090b12;
}
.app {
  width: min(960px, 100%);
  display: grid;
  gap: 16px;
}
.card {
  background: rgba(17, 21, 34, 0.94);
  border: 1px solid rgba(123, 146, 197, 0.28);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.row > * { flex: 1 1 200px; }
input, textarea, button {
  font: inherit;
  border-radius: 10px;
  border: 1px solid rgba(118, 135, 182, 0.45);
  background: rgba(11, 15, 26, 0.96);
  color: inherit;
  padding: 12px 14px;
}
input { min-width: 0; }
textarea {
  width: 100%;
  min-height: 260px;
  resize: vertical;
  font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  line-height: 1.45;
}
button {
  cursor: pointer;
  background: linear-gradient(180deg, #6d54ff 0%, #5844da 100%);
  border-color: rgba(161, 139, 255, 0.75);
  transition: transform 0.12s ease, filter 0.12s ease;
}
button:hover { filter: brightness(1.05); }
button:active { transform: translateY(1px); }
button.secondary {
  background: rgba(28, 38, 56, 0.9);
  border-color: rgba(118, 135, 182, 0.45);
}
.messages {
  height: 300px;
  overflow: auto;
  display: grid;
  align-content: start;
  gap: 10px;
  padding: 8px 4px 4px;
  margin-bottom: 12px;
}
.msg {
  max-width: 85%;
  white-space: pre-wrap;
  padding: 10px 12px;
  border-radius: 14px;
  line-height: 1.45;
}
.msg.user {
  justify-self: end;
  background: linear-gradient(180deg, #725dff 0%, #6047df 100%);
}
.msg.ai {
  justify-self: start;
  background: rgba(39, 49, 68, 0.95);
}
.status {
  min-height: 24px;
  color: #aab8d7;
  font-size: 13px;
  margin-top: 10px;
}
.small {
  color: #a6b7d3;
  font-size: 13px;
}
code {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 1px 5px;
}
.hidden { display: none; }
</style>
</head>
<body>
<main class="app">
  <section class="card">
    <h1>AIDEN</h1>
    <p class="small">A browser chat assistant that remembers user facts and can be edited live.</p>
    <div id="messages" class="messages"></div>
    <div class="row">
      <input id="input" placeholder="Talk to AIDEN…" aria-label="User input">
      <button id="send">Send</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <h2>Behavior editor</h2>
    <p class="small">This code is stored only in this browser. It can be changed without a password.</p>
    <div id="editorPanel">
      <p class="small">The function receives: <code>input</code>, <code>memory</code>, and <code>count</code>. It must return a string.</p>
      <textarea id="code"></textarea>
      <div class="row" style="margin-top: 12px;">
        <button id="apply">Apply code</button>
        <button id="reset" class="secondary">Reset code</button>
        <button id="download" class="secondary">Download edited copy</button>
      </div>
    </div>
  </section>
</main>

<script>
'use strict';

const DEFAULT_CODE = `const text = input.toLowerCase();
if (/\b(hi|hello|hey|yo)\b/.test(text)) return 'Hey. I remember what you tell me, and I can learn from it.';
if (text.includes('who are you')) return 'I am AIDEN. I store what you tell me and use it to respond more personally.';
if (text.includes('what do you remember')) return memory.length ? 'I remember: ' + memory.join('; ') : 'I do not remember anything yet.';
if (text.includes('learn')) return 'I can learn from your input and store useful facts in memory.';
if (text.includes('code')) return 'I can be edited live in this browser.';
if (text.endsWith('?')) return 'That is interesting. Tell me more.';
return 'I heard you: ' + input;`;

const MEMORY_KEY = 'aiden_memory_v1';
const CODE_KEY = 'aiden_code_v1';
const MSG_KEY = 'aiden_messages_v1';

let code = localStorage.getItem(CODE_KEY) || DEFAULT_CODE;
let messages = JSON.parse(localStorage.getItem(MSG_KEY) || '[]');
let memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || '[]');
let count = 0;

const $ = (id) => document.getElementById(id);

$('code').value = code;

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

function saveMessages() {
  localStorage.setItem(MSG_KEY, JSON.stringify(messages.slice(-80)));
}

function saveMemory() {
  localStorage.setItem(MEMORY_KEY, JSON.stringify(memory.slice(-200)));
}

function render() {
  $('messages').innerHTML = messages
    .map((m) => `<div class="msg ${m.role}">${esc(m.text)}</div>`)
    .join('');
  $('messages').scrollTop = $('messages').scrollHeight;
  saveMessages();
}

function learnFromInput(input) {
  const text = input.trim();
  if (!text) return;

  const entries = [
    text.match(/my name is\s+(.+)/i),
    text.match(/i am\s+(.+)/i),
    text.match(/i like\s+(.+)/i),
    text.match(/i love\s+(.+)/i),
    text.match(/i work\s+(?:at|for)\s+(.+)/i),
    text.match(/my favorite\s+(.+)/i),
    text.match(/i live\s+(?:in|at)\s+(.+)/i),
    text.match(/i want\s+(.+)/i),
    text.match(/i prefer\s+(.+)/i),
    text.match(/my hobby is\s+(.+)/i),
    text.match(/my goal is\s+(.+)/i)
  ].map((m) => m && m[1] && m[1].trim()).filter(Boolean);

  for (const entry of entries) {
    const clean = entry.replace(/[.!?]+$/, '').trim();
    if (!memory.includes(clean)) {
      memory.push(clean);
    }
  }

  if (text.length > 10 && /\b(i am|my name is|i like|i love|i prefer|i want|my favorite)\b/i.test(text)) {
    saveMemory();
  }
}

function runBehavior(input) {
  try {
    const fn = Function('input', 'memory', 'count', code);
    const result = fn(input, memory, count);
    return typeof result === 'string' ? result : 'I responded, but my behavior code did not return a string.';
  } catch (error) {
    return 'My behavior code has an error: ' + error.message;
  }
}

function send() {
  const input = $('input').value.trim();
  if (!input) return;

  $('input').value = '';
  messages.push({ role: 'user', text: input });
  count += 1;

  learnFromInput(input);

  const reply = runBehavior(input);
  messages.push({ role: 'ai', text: reply });

  render();
  $('status').textContent = memory.length
    ? 'AIDEN learned ' + memory.length + ' stored fact' + (memory.length === 1 ? '' : 's') + '.'
    : 'AIDEN is ready to learn.';
}

$('send').addEventListener('click', send);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

$('apply').addEventListener('click', () => {
  const candidate = $('code').value;
  try {
    const test = Function('input', 'memory', 'count', candidate);
    const result = test('test input', memory, count);
    if (typeof result !== 'string') {
      throw new Error('Behavior code must return a string.');
    }
    code = candidate;
    localStorage.setItem(CODE_KEY, code);
    $('status').textContent = 'Behavior code applied successfully.';
  } catch (error) {
    $('status').textContent = 'Code error: ' + error.message;
  }
});

$('reset').addEventListener('click', () => {
  code = DEFAULT_CODE;
  $('code').value = code;
  localStorage.setItem(CODE_KEY, code);
  $('status').textContent = 'Behavior reset to default.';
});

$('download').addEventListener('click', () => {
  const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIDEN Export</title>
</head>
<body>
<script>
const code = ${JSON.stringify(code)};
const memory = ${JSON.stringify(memory)};
const fn = Function('input', 'memory', 'count', code);
console.log(fn('hello', memory, 0));
<\/script>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'AIDEN-edited.html';
  a.click();
  URL.revokeObjectURL(url);
  $('status').textContent = 'Edited copy downloaded.';
});

if (messages.length === 0) {
  messages.push({ role: 'ai', text: 'Hi. I can remember what you tell me and keep learning over time.' });
}

render();
if (memory.length) {
  $('status').textContent = 'AIDEN remembers ' + memory.length + ' fact' + (memory.length === 1 ? '' : 's') + '.';
} else {
  $('status').textContent = 'AIDEN is ready to learn.';
}
</script>
</body>
</html>
