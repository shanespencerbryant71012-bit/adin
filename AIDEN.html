      if(facts.length>0)r='From what you\'ve told me: "'+facts[Math.floor(Math.random()*facts.length)].slice(0,100)+'". Is that what you meant?'
      else r="I don\'t have anything stored yet. Tell me something and I\'ll remember it."
    } else if(/why/i.test(lower))r=pick(["That\'s a fair question. What\'s your best guess?","I\'m not sure — what do you think?","I don\'t have a confident answer. What\'s making you ask?"])
    else if(/how/i.test(lower))r=pick(["Depends on the context. Can you give me more to work with?","Walk me through what you\'re trying to do and I\'ll think with you."])
    else r=pick(["Honestly not sure. What\'s making you ask?","I don\'t know — what do you think?","I\'d need more context. What\'s the situation?"])
  } else if(input.length>4){
    if(extractFacts(input).length>0)r=pick(["I\'ll remember that. What made you mention it?","Noted — that\'s useful context.","Got it. I\'ll hold onto that."])
    else if(/i (think|believe|feel like)/i.test(lower))r=pick(["What makes you think that?","Interesting — say more.","I can see that. What\'s behind it?"])
    else if(/i (want|need|wish)/i.test(lower))r=pick(["What\'s stopping you?","Tell me more about that.","Why that specifically?"])
    else if(input.length<20)r=pick(["Say more.","What do you mean?","Okay — and?","Tell me more."])
    else r=pick(["I hear you. What do you want to do about it?","That makes sense. What\'s next?","Got it. What do you need from me here?","Okay — how do you feel about that?"])
    if(facts.length>3&&Math.random()>.82){const m=facts[Math.floor(Math.random()*facts.length)];r+=' (You mentioned: "'+m.slice(0,55)+'..." — related?)'}
  } else r="What\'s up?"
  return uncensored?r:censor(r)
}

function generateResponse(input,st,fileContent){
  const trimmed=input.trim()
  let s={...st,interactionCount:st.interactionCount+1}
  const ownerM=trimmed.match(/^\/owner\s+(.+)$/i)
  if(ownerM){
    if(ownerM[1].trim()===st.ownerPassword)return{response:'Owner mode activated. What I become now depends on you.',updatedState:{...s,isOwner:true}}
    return{response:"That\'s not the right password.",updatedState:s}
  }
  const unlockM=trimmed.match(/^!unlock\s+(\S+)\s+(.+)$/i)
  if(unlockM){
    if(unlockM[1]===st.uncensoredPassword){
      const inner=unlockM[2]
      const nf=extractFacts(inner);if(nf.length)s={...s,facts:[...s.facts,...nf].slice(-60)}
      if(st.isOwner)s={...s,personality:evolveP(s.personality,inner)}
      return{response:respond(inner,s.personality,s.facts,s.interactionCount,true),updatedState:s}
    }
    return{response:'Wrong unlock password.',updatedState:s}
  }
  const nf=extractFacts(trimmed);if(nf.length)s={...s,facts:[...s.facts,...nf].slice(-60)}
  if(st.isOwner)s={...s,personality:evolveP(s.personality,trimmed)}
  return{response:respond(trimmed,s.personality,s.facts,s.interactionCount,false,fileContent),updatedState:s}
}

function getLevel(count){
  const t=[5,15,30,50,75,100,150,200,300]
  const i=t.findIndex(n=>count<n)
  return i===-1?10:i+1
}
function getLevelBounds(level){
  const t=[0,5,15,30,50,75,100,150,200,300,400]
  return{lo:t[level-1]??0,hi:t[level]??400}
}
function getMood(p){
  const s=Object.entries(p).sort((a,b)=>b[1]-a[1])
  const top=s[0][0]
  if(top==='curiosity')return'curious'
  if(top==='humor')return'playful'
  if(top==='creativity')return'contemplative'
  if(top==='warmth')return'warm'
  if(top==='moodiness')return'volatile'
  return'focused'
}

const MOOD_COLORS={curious:'#22d3ee',playful:'#c084fc',contemplative:'#818cf8',warm:'#f472b6',volatile:'#fb923c',focused:'#34d399'}
const TRAITS=['curiosity','warmth','humor','directness','moodiness','creativity']
const TRAIT_LABELS={curiosity:'Curiosity',warmth:'Warmth',humor:'Humor',directness:'Directness',moodiness:'Moodiness',creativity:'Creativity'}

// ── Voice ────────────────────────────────────────────────────────────────────
function speak(text,p){
  if(!voiceOn||!window.speechSynthesis)return
  window.speechSynthesis.cancel()
  const u=new SpeechSynthesisUtterance(text)
  u.rate=Math.max(0.7,Math.min(1.5,0.88+(p.directness/100)*0.28+(p.humor/100)*0.15+(p.moodiness>55?(Math.random()-.5)*0.12:0)))
  u.pitch=Math.max(0.6,Math.min(1.8,0.92+(p.curiosity/100)*0.3+(p.humor/100)*0.2-(p.directness/100)*0.1+(p.moodiness>55?(Math.random()-.5)*0.18:0)))
  u.volume=Math.min(1,0.82+(p.warmth/100)*0.18)
  window.speechSynthesis.speak(u)
}

function initSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition
  if(!SR)return
  recognition=new SR()
  recognition.continuous=false
  recognition.interimResults=true
  recognition.lang='en-US'
  recognition.onresult=e=>{
    let interim='',final=''
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript
      else interim+=e.results[i][0].transcript
    }
    document.getElementById('text-input').value=final||interim
  }
  recognition.onend=()=>{
    listening=false
    updateMicBtn()
    const val=document.getElementById('text-input').value.trim()
    if(val)sendMessage(val)
  }
  recognition.onerror=()=>{listening=false;updateMicBtn()}
}

function updateMicBtn(){
  const btn=document.getElementById('mic-btn')
  if(listening){btn.classList.add('listening');btn.textContent='⏹'}
  else{btn.classList.remove('listening');btn.textContent='🎤'}
}

// ── UI helpers ───────────────────────────────────────────────────────────────
function getMoodColor(){return MOOD_COLORS[getMood(state.personality)]||'#7c3aed'}

function updateUI(){
  const mood=getMood(state.personality)
  const color=MOOD_COLORS[mood]||'#7c3aed'
  const level=getLevel(state.interactionCount)
  const {lo,hi}=getLevelBounds(level)
  const pct=Math.min(100,((state.interactionCount-lo)/(hi-lo))*100)

  document.getElementById('mood-dot').style.cssText='background:'+color+';box-shadow:0 0 8px '+color
  document.getElementById('level-badge').textContent='LV.'+level
  document.getElementById('level-badge').style.cssText='font-size:9px;font-family:JetBrains Mono,monospace;color:'+color+';background:'+color+'1a;border:1px solid '+color+'40;padding:2px 6px;border-radius:4px;letter-spacing:.1em'
  document.getElementById('mood-label').textContent=mood
  document.getElementById('progress-fill').style.cssText='width:'+pct+'%;background:linear-gradient(90deg,#7c3aed,'+color+')'
  document.getElementById('owner-badge').style.display=state.isOwner?'inline':'none'
  document.getElementById('orb-dot').style.cssText='width:9px;height:9px;border-radius:50%;background:'+color+';box-shadow:0 0 8px '+color
  document.getElementById('orb-level').textContent=level
  document.getElementById('orb-level').style.cssText='position:absolute;top:-4px;right:-4px;width:19px;height:19px;border-radius:50%;background:#09091a;border:1.5px solid '+color+';display:flex;align-items:center;justify-content:center;font-size:8px;font-family:JetBrains Mono,monospace;font-weight:700;color:'+color

  // Trait rows
  const tr=document.getElementById('trait-rows')
  tr.innerHTML=TRAITS.map(t=>'<div class="trait-row"><span class="trait-name">'+TRAIT_LABELS[t]+'</span><div class="trait-bar-bg"><div class="trait-bar-fill" style="width:'+Math.round(state.personality[t])+'%;background:linear-gradient(90deg,#7c3aed,'+color+')"></div></div><span class="trait-val">'+Math.round(state.personality[t])+'</span></div>').join('')
  document.getElementById('stat-interactions').textContent=state.interactionCount+' interactions'
  document.getElementById('stat-memories').textContent=state.facts.length+' memories'

  // Send btn
  const inp=document.getElementById('text-input').value.trim()
  const snd=document.getElementById('send-btn')
  snd.style.cssText='border:none;border-radius:10px;padding:8px 14px;font-size:16px;flex-shrink:0;cursor:'+(inp&&!typing?'pointer':'default')+';line-height:1;background:'+(inp&&!typing?'linear-gradient(135deg,#7c3aed,#6d28d9)':'rgba(255,255,255,.07)')+';color:'+(inp&&!typing?'#fff':'rgba(255,255,255,.25)')

  // Input focus color
  document.getElementById('text-input').onfocus=e=>e.target.style.borderColor=color+'60'
  document.getElementById('text-input').onblur=e=>e.target.style.borderColor='rgba(255,255,255,.09)'

  // Typing dots color
  document.querySelectorAll('.dot').forEach(d=>d.style.background=color)
  // AI bubble border color
  document.querySelectorAll('.bubble.ai').forEach(b=>b.style.borderLeft='2px solid '+color)
}

function addMessage(role,content,isFile){
  messages.push({role,content,isFile:!!isFile,timestamp:Date.now()})
  saveMsgs()
  renderMessages()
}

function renderMessages(){
  const color=getMoodColor()
  const el=document.getElementById('messages')
  el.innerHTML=messages.map(m=>{
    const fileClass=m.isFile?' file':''
    const bubbleStyle=m.role==='ai'?'border-left:2px solid '+color:'';
    return '<div class="msg '+m.role+'"><div class="bubble '+m.role+fileClass+'" style="'+bubbleStyle+'">'+(m.isFile?'📎 ':'')+escHtml(m.content)+'</div></div>'
  }).join('')
  el.scrollTop=el.scrollHeight
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setTyping(v){
  typing=v
  document.getElementById('typing').className=v?'show':''
  const el=document.getElementById('messages')
  if(v)el.scrollTop=el.scrollHeight
  updateUI()
}

async function sendMessage(text,fileContent){
  if(!text.trim()||typing)return
  document.getElementById('text-input').value=''
  addMessage('user',text)
  setTyping(true)
  await new Promise(r=>setTimeout(r,500+Math.random()*900))
  const{response,updatedState}=generateResponse(text,state,fileContent)
  state=updatedState
  saveState()
  setTyping(false)
  addMessage('ai',response)
  speak(response,state.personality)
  updateUI()
  // Pulse orb
  const orb=document.getElementById('orb')
  const color=getMoodColor()
  orb.style.boxShadow='0 0 0 3px rgba(168,85,247,.35),0 0 24px rgba(124,58,237,.6),0 0 48px rgba(124,58,237,.25)'
  setTimeout(()=>{orb.style.boxShadow='0 0 0 1px rgba(168,85,247,.2),0 0 14px rgba(124,58,237,.3)'},2500)
}

// ── Download ─────────────────────────────────────────────────────────────────
function downloadSelf(){
  // Build a fresh copy with current state but owner flag reset (guest copy)
  const guestState={...state,isOwner:false}
  const stateStr=JSON.stringify(guestState)
  const msgsStr=JSON.stringify(messages.slice(-80))
  // Re-inject current state into this page's source and download
  const src=document.documentElement.outerHTML
  const updated=src
    .replace(/const INIT_STATE = .*?(?=\n)/,'const INIT_STATE = '+stateStr)
    .replace(/const INIT_MSGS = .*?(?=\n)/,'const INIT_MSGS = '+msgsStr)
  const blob=new Blob([updated],{type:'text/html;charset=utf-8'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  a.href=url
  a.download='AIDEN-lv'+getLevel(state.interactionCount)+'.html'
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

// ── Init ─────────────────────────────────────────────────────────────────────
initSpeechRecognition()
renderMessages()
updateUI()

document.getElementById('orb').onclick=()=>{
  const p=document.getElementById('panel')
  p.classList.toggle('open')
}
document.getElementById('close-btn').onclick=()=>document.getElementById('panel').classList.remove('open')
document.getElementById('stats-toggle').onclick=function(){
  const sp=document.getElementById('stats-panel')
  sp.classList.toggle('open')
  this.classList.toggle('active')
}
document.getElementById('voice-toggle').onclick=function(){
  voiceOn=!voiceOn
  this.textContent=voiceOn?'🔊':'🔇'
  this.classList.toggle('active',voiceOn)
  if(!voiceOn)window.speechSynthesis&&window.speechSynthesis.cancel()
}
document.getElementById('download-btn').onclick=downloadSelf
document.getElementById('mic-btn').onclick=()=>{
  if(!recognition){alert('Speech recognition not supported in this browser.');return}
  if(listening){recognition.stop()}
  else{listening=true;updateMicBtn();recognition.start()}
}
document.getElementById('file-btn').onclick=()=>document.getElementById('file-input').click()
document.getElementById('file-input').onchange=function(){
  const file=this.files[0];if(!file)return
  addMessage('user','📎 '+file.name,true)
  this.value=''
  const isReadable=file.type.startsWith('text/')||/\.(txt|md|csv|json|js|ts|tsx|jsx|py|html|css|xml|yaml|yml|log|sh|toml|ini|conf)$/i.test(file.name)
  if(!isReadable){addMessage('ai','I can see '+file.name+' but I can\'t read binary files. Send me a text, JSON, CSV, or code file.');return}
  const MAX=100000
  const blob=file.size>MAX?file.slice(0,MAX):file
  const reader=new FileReader()
  reader.onload=e=>{
    const content=file.size>MAX?'[file: '+file.name+', '+((file.size/1024/1024).toFixed(1))+' MB — showing first portion]\n'+(e.target.result||''):(e.target.result||'')
    sendMessage('[file: '+file.name+']',content)
  }
  reader.onerror=()=>sendMessage('[file: '+file.name+']',undefined)
  reader.readAsText(blob)
}
document.getElementById('text-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(document.getElementById('text-input').value)}}
document.getElementById('send-btn').onclick=()=>sendMessage(document.getElementById('text-input').value)
document.getElementById('text-input').oninput=updateUI
</script>
